name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Variables mínimas para CI
      - name: Create .env for CI
        run: |
          cat <<'EOF' > .env.local
          NEXT_PUBLIC_SANITY_PROJECT_ID=placeholder
          NEXT_PUBLIC_SANITY_DATASET=production
          SANITY_API_TOKEN=placeholder
          NEXT_PUBLIC_SITE_URL=https://mymarketing.es
          SENTRY_DSN=
          EOF

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Descomenta cuando existan tests:
      # - name: Tests
      #   run: npm test
