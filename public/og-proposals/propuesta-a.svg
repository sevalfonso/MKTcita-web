  <!-- Puntos de color Google en la barra -->
  <rect x="0"   y="594" width="300" height="36" fill="#4285F4"/>
  <rect x="300" y="594" width="300" height="36" fill="#34A853"/>
  <rect x="600" y="594" width="300" height="36" fill="#FBBC05"/>
  <rect x="900" y="594" width="300" height="36" fill="#EA4335"/>

  <!-- Isotipo centrado arriba -->
  <g transform="translate(420, 80) scale(1.8)">
    <rect x="8"  y="12" width="88" height="68" rx="22" fill="#4285F4" opacity="0.18"/>
